<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAM - Programma a Punti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for a gamified look */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            -webkit-tap-highlight-color: transparent;
        }
        .game-btn {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 0 rgba(0,0,0,0.2);
        }
        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 0 rgba(0,0,0,0.2);
        }
        .game-card {
            box-shadow: 0 8px 0 0 rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .game-card:hover {
            transform: translateY(-4px);
        }
        .tab-active {
            color: #3b82f6;
            border-bottom: 4px solid #3b82f6;
        }
        .tab-inactive {
            color: #94a3b8;
            border-bottom: 4px solid transparent;
        }
        
        /* Toast animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast {
            animation: slideUpFade 3s forwards;
        }
        
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <script>
        // Database simulato (in-memory)
        const appData = {
            ragazzi: [
                { id: 1, nome: "Leo", avatar: "🦊", punti: 125, squadra: "blu" },
                { id: 2, nome: "Sofia", avatar: "🦄", punti: 150, squadra: "rossa" },
                { id: 3, nome: "Matteo", avatar: "🦖", punti: 90, squadra: "gialla" },
                { id: 4, nome: "Giulia", avatar: "🦋", punti: 110, squadra: "verde" },
                { id: 5, nome: "Ale", avatar: "🐶", punti: 85, squadra: "blu" },
                { id: 6, nome: "Marti", avatar: "🐼", punti: 140, squadra: "rossa" },
                { id: 7, nome: "Fede", avatar: "🦁", punti: 95, squadra: "gialla" },
                { id: 8, nome: "Chiara", avatar: "🐰", punti: 105, squadra: "verde" }
            ],
            squadre: {
                "rossa": { nome: "Draghi Rossi", colore: "bg-red-500", border: "border-red-600" },
                "blu": { nome: "Lupi Blu", colore: "bg-blue-500", border: "border-blue-600" },
                "gialla": { nome: "Tigri Gialle", colore: "bg-yellow-400", border: "border-yellow-500" },
                "verde": { nome: "Orsi Verdi", colore: "bg-green-500", border: "border-green-600" }
            },
            premi: [
                { id: 1, titolo: "Scegli il Gioco", costo: 50, icona: "🎲", desc: "Scegli tu a cosa si gioca questa sera." },
                { id: 2, titolo: "Posto VIP", costo: 80, icona: "👑", desc: "Il divano o la sedia migliore della sala è tua." },
                { id: 3, titolo: "DJ per 1 Ora", costo: 100, icona: "🎧", desc: "Metti la tua playlist in sottofondo." },
                { id: 4, titolo: "Salta Pulizie", costo: 150, icona: "🧹", desc: "Usa questo bonus per non riordinare a fine serata." },
                { id: 5, titolo: "Snack Offerto", costo: 200, icona: "🍫", desc: "Un pacchetto di patatine o merendina gratis." },
                { id: 6, titolo: "Pizzata Piena", costo: 500, icona: "🍕", desc: "Traguardo epico: una pizza pagata dagli animatori!" }
            ],
            currentTab: 'leaderboard',
            leaderboardView: 'ragazzi' // 'ragazzi' o 'squadre'
        };

        // Calcolo punti squadra
        function getPuntiSquadre() {
            let puntiSquadre = {};
            Object.keys(appData.squadre).forEach(s => {
                puntiSquadre[s] = 0;
            });
            appData.ragazzi.forEach(r => {
                puntiSquadre[r.squadra] += r.punti;
            });
            return Object.keys(puntiSquadre).map(s => ({
                id: s,
                ...appData.squadre[s],
                punti: puntiSquadre[s]
            })).sort((a, b) => b.punti - a.punti);
        }
    </script>

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🎮</span>
                <h1 class="text-2xl font-black tracking-wide">GAM<span class="text-indigo-200">Quest</span></h1>
            </div>
            <div class="bg-indigo-800 rounded-full px-4 py-1 font-bold text-sm border-2 border-indigo-400">
                Stagione 1
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="main-content" class="max-w-3xl mx-auto p-4 mt-4">
        <!-- Contenuto renderizzato via JS -->
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-20 left-1/2 z-50 pointer-events-none"></div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
        <div class="max-w-3xl mx-auto flex justify-around">
            <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="flex-1 py-4 flex flex-col items-center gap-1 tab-active font-bold transition-colors">
                <span class="text-2xl">🏆</span>
                <span class="text-xs uppercase tracking-wider">Classifica</span>
            </button>
            <button onclick="switchTab('punti')" id="nav-punti" class="flex-1 py-4 flex flex-col items-center gap-1 tab-inactive font-bold transition-colors">
                <span class="text-2xl">⚡</span>
                <span class="text-xs uppercase tracking-wider">Gestisci</span>
            </button>
            <button onclick="switchTab('premi')" id="nav-premi" class="flex-1 py-4 flex flex-col items-center gap-1 tab-inactive font-bold transition-colors">
                <span class="text-2xl">🎁</span>
                <span class="text-xs uppercase tracking-wider">Premi</span>
            </button>
        </div>
    </nav>

    <script>
        // Funzione principale per renderizzare le view
        function renderView() {
            const main = document.getElementById('main-content');
            main.innerHTML = ''; // Pulisce
            
            if (appData.currentTab === 'leaderboard') {
                renderLeaderboard(main);
            } else if (appData.currentTab === 'punti') {
                renderPunti(main);
            } else if (appData.currentTab === 'premi') {
                renderPremi(main);
            }
        }

        function switchTab(tab) {
            appData.currentTab = tab;
            
            // Aggiorna stili bottoni
            ['leaderboard', 'punti', 'premi'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(t === tab) {
                    btn.classList.replace('tab-inactive', 'tab-active');
                } else {
                    btn.classList.replace('tab-active', 'tab-inactive');
                }
            });
            
            renderView();
        }

        function renderLeaderboard(container) {
            const toggleHtml = `
                <div class="flex bg-slate-200 rounded-xl p-1 mb-6">
                    <button onclick="toggleLeaderboard('ragazzi')" class="flex-1 py-2 rounded-lg font-bold ${appData.leaderboardView === 'ragazzi' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}">Ragazzi</button>
                    <button onclick="toggleLeaderboard('squadre')" class="flex-1 py-2 rounded-lg font-bold ${appData.leaderboardView === 'squadre' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}">Squadre</button>
                </div>
            `;
            
            let listHtml = '<div class="space-y-3">';
            
            if (appData.leaderboardView === 'ragazzi') {
                const sorted = [...appData.ragazzi].sort((a, b) => b.punti - a.punti);
                sorted.forEach((r, index) => {
                    const squadraData = appData.squadre[r.squadra];
                    const rank = index + 1;
                    let badge = `<span class="w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full font-black">${rank}</span>`;
                    if (rank === 1) badge = `<span class="w-8 h-8 flex items-center justify-center bg-yellow-100 text-yellow-600 rounded-full font-black text-xl">🥇</span>`;
                    if (rank === 2) badge = `<span class="w-8 h-8 flex items-center justify-center bg-slate-200 text-slate-600 rounded-full font-black text-xl">🥈</span>`;
                    if (rank === 3) badge = `<span class="w-8 h-8 flex items-center justify-center bg-orange-100 text-orange-600 rounded-full font-black text-xl">🥉</span>`;

                    listHtml += `
                        <div class="game-card bg-white rounded-2xl p-4 flex items-center justify-between border-2 border-slate-100">
                            <div class="flex items-center gap-4">
                                ${badge}
                                <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-3xl border-2 ${squadraData.border}">
                                    ${r.avatar}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg leading-tight">${r.nome}</h3>
                                    <span class="text-xs font-bold px-2 py-1 rounded-full text-white ${squadraData.colore}">${squadraData.nome}</span>
                                </div>
                            </div>
                            <div class="bg-indigo-50 px-4 py-2 rounded-xl text-indigo-700 font-black text-lg border-2 border-indigo-100">
                                ${r.punti} ⭐
                            </div>
                        </div>
                    `;
                });
            } else {
                const squadreSort = getPuntiSquadre();
                squadreSort.forEach((s, index) => {
                    const rank = index + 1;
                    listHtml += `
                        <div class="game-card bg-white rounded-2xl p-5 flex items-center justify-between border-4 ${s.border}">
                            <div class="flex items-center gap-4">
                                <span class="text-2xl font-black text-slate-400">#${rank}</span>
                                <h3 class="font-black text-xl ${s.colore.replace('bg-', 'text-')}">${s.nome}</h3>
                            </div>
                            <div class="bg-slate-100 px-5 py-3 rounded-xl text-slate-800 font-black text-2xl border-2 border-slate-200 shadow-inner">
                                ${s.punti} ⭐
                            </div>
                        </div>
                    `;
                });
            }
            
            listHtml += '</div>';
            container.innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-black text-slate-800">Classifica Generale</h2>
                    <p class="text-slate-500 text-sm">Chi dominerà questa stagione?</p>
                </div>
                ${toggleHtml}
                ${listHtml}
            `;
        }

        window.toggleLeaderboard = function(view) {
            appData.leaderboardView = view;
            renderView();
        }

        function renderPunti(container) {
            let userOptions = appData.ragazzi.map(r => `
                <div onclick="selectUser(${r.id})" class="cursor-pointer bg-white p-3 rounded-xl border-2 border-slate-200 flex items-center gap-3 hover:border-indigo-400 transition-colors user-select-card" id="user-card-${r.id}">
                    <span class="text-2xl">${r.avatar}</span>
                    <span class="font-bold flex-1">${r.nome}</span>
                    <span class="text-sm font-bold text-slate-400">${r.punti}⭐</span>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="bg-indigo-100 rounded-xl p-4 mb-6 border-2 border-indigo-200 text-indigo-800 text-sm font-bold flex items-start gap-2">
                    <span class="text-xl">⚠️</span>
                    <p>Questa sezione è per gli animatori. Seleziona un ragazzo per assegnare o togliere punti.</p>
                </div>
                
                <h3 class="font-black mb-3">1. Seleziona Ragazzo/a</h3>
                <div class="grid grid-cols-2 gap-2 mb-6 max-h-48 overflow-y-auto p-1">
                    ${userOptions}
                </div>

                <div id="action-panel" class="opacity-50 pointer-events-none transition-opacity bg-white p-5 rounded-2xl border-2 border-slate-200 shadow-sm">
                    <h3 class="font-black mb-4 text-center">2. Assegna Punti a <span id="selected-name" class="text-indigo-600">...</span></h3>
                    
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <button onclick="addPoints(1)" class="game-btn bg-green-400 text-green-900 font-black rounded-xl py-3 border-2 border-green-500">+1</button>
                        <button onclick="addPoints(5)" class="game-btn bg-green-500 text-white font-black rounded-xl py-3 border-2 border-green-600">+5</button>
                        <button onclick="addPoints(10)" class="game-btn bg-green-600 text-white font-black rounded-xl py-3 border-2 border-green-700">+10</button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="addPoints(-1)" class="game-btn bg-red-100 text-red-600 font-bold rounded-xl py-2 border-2 border-red-200">-1</button>
                        <button onclick="addPoints(-5)" class="game-btn bg-red-200 text-red-700 font-bold rounded-xl py-2 border-2 border-red-300">-5</button>
                    </div>
                </div>
            `;
            
            // Reset selection
            window.selectedUserId = null;
        }

        window.selectUser = function(id) {
            window.selectedUserId = id;
            
            // Update UI
            document.querySelectorAll('.user-select-card').forEach(el => {
                el.classList.remove('border-indigo-500', 'bg-indigo-50');
                el.classList.add('border-slate-200', 'bg-white');
            });
            const selectedCard = document.getElementById(`user-card-${id}`);
            selectedCard.classList.remove('border-slate-200', 'bg-white');
            selectedCard.classList.add('border-indigo-500', 'bg-indigo-50');

            const user = appData.ragazzi.find(r => r.id === id);
            document.getElementById('selected-name').innerText = user.nome;
            
            const panel = document.getElementById('action-panel');
            panel.classList.remove('opacity-50', 'pointer-events-none');
        }

        window.addPoints = function(amount) {
            if (!window.selectedUserId) return;
            
            const userIndex = appData.ragazzi.findIndex(r => r.id === window.selectedUserId);
            if (userIndex > -1) {
                appData.ragazzi[userIndex].punti += amount;
                
                // Prevent negative points
                if(appData.ragazzi[userIndex].punti < 0) appData.ragazzi[userIndex].punti = 0;

                const user = appData.ragazzi[userIndex];
                
                // Show Toast
                showToast(amount > 0 ? `+${amount}` : amount, user.nome, amount > 0 ? 'bg-green-500' : 'bg-red-500');
                
                // Re-render
                renderPunti(document.getElementById('main-content'));
                // Reselect automatically to allow spamming
                setTimeout(() => window.selectUser(user.id), 0);
            }
        }

        function showToast(text, name, bgColor) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${bgColor} text-white px-6 py-3 rounded-full font-black text-lg shadow-lg border-4 border-white flex items-center gap-2 absolute transform -translate-x-1/2 whitespace-nowrap`;
            toast.innerHTML = `<span>${text} ⭐ a ${name}!</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function renderPremi(container) {
            let gridHtml = '<div class="grid grid-cols-2 gap-4 pb-10">';
            
            appData.premi.forEach(p => {
                gridHtml += `
                    <div class="game-card bg-white rounded-2xl overflow-hidden border-2 border-slate-200 flex flex-col">
                        <div class="bg-indigo-50 py-6 text-center border-b-2 border-indigo-100 relative">
                            <span class="text-5xl drop-shadow-md">${p.icona}</span>
                            <div class="absolute top-2 right-2 bg-yellow-400 text-yellow-900 text-xs font-black px-2 py-1 rounded-lg border-2 border-yellow-500 shadow-sm">
                                ${p.costo} ⭐
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-black text-sm text-slate-800 leading-tight mb-1">${p.titolo}</h3>
                                <p class="text-[10px] text-slate-500 leading-snug">${p.desc}</p>
                            </div>
                            <button onclick="mockRedeem('${p.titolo}')" class="game-btn w-full mt-3 bg-indigo-500 text-white font-bold text-xs py-2 rounded-xl border-2 border-indigo-600">
                                Riscatta
                            </button>
                        </div>
                    </div>
                `;
            });
            gridHtml += '</div>';

            container.innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-black text-slate-800">Negozio Premi</h2>
                    <p class="text-slate-500 text-sm">Spendi le tue ⭐ guadagnate!</p>
                </div>
                ${gridHtml}
            `;
        }

        window.mockRedeem = function(item) {
            // Semplice mockup per il riscatto
            alert(`Vuoi riscattare "${item}"? Nella versione finale l'animatore scalerà i punti dal tuo profilo!`);
        }

        // Initialize app
        window.onload = () => {
            renderView();
        };
    </script>
</body>
</html>
