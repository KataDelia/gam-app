<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punti GAM</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 2.5rem; text-shadow: 2px 2px 0px #000; color: #f1c40f; }
        
        .box {
            background-color: #34495e;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 8px 0 #1a252f;
        }

        /* Stile Podio */
        .podio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ecf0f1;
            color: #2c3e50;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #bdc3c7;
        }
        .medaglia { font-size: 1.5rem; }
        .oro { background: #f1c40f; }
        .argento { background: #e0e0e0; }
        .bronzo { background: #d35400; color: white; }

        /* Stile Login PIN */
        input[type="number"] {
            font-size: 1.5rem;
            padding: 10px;
            width: 80%;
            border-radius: 8px;
            border: none;
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            box-shadow: 0 5px 0 #c0392b;
            cursor: pointer;
            font-weight: bold;
            width: 85%;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* Area Personale */
        #risultatoPersonale {
            display: none;
            margin-top: 20px;
            font-size: 1.5rem;
            background: #2ecc71;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 0 #27ae60;
        }
        .loading { font-style: italic; color: #bdc3c7; }
    </style>
</head>
<body>

    <h1>🏆 Punti GAM 🏆</h1>

    <!-- SEZIONE PODIO -->
    <div class="box">
        <h2>La Top 3</h2>
        <div id="loadingPodio" class="loading">Caricamento classifica...</div>
        <div id="contenitorePodio"></div>
    </div>

    <!-- SEZIONE PERSONALE -->
    <div class="box">
        <h2>I Miei Punti</h2>
        <p>Inserisci il tuo PIN segreto per vedere il tuo punteggio!</p>
        <input type="number" id="pinInput" placeholder="PIN Segreto (es. 1234)">
        <button onclick="cercaPunti()">Scopri i punti!</button>

        <div id="risultatoPersonale">
            <span id="nomeRagazzo"></span>, hai<br>
            <strong style="font-size: 3rem;" id="puntiRagazzo"></strong><br>
            punti! ⭐️
        </div>
    </div>

    <script>
        // === INSERISCI QUI IL LINK COPIATO DA APPS SCRIPT ===
        const API_URL = https://script.google.com/macros/s/AKfycby_Q0oUPjtt6BiOL3cE59Sr_AZhoZzeCxqSjnPQZuOnwH4mSfmZ8AovWiNZOyL1VaTw9A/exec;

        // Funzione per caricare il podio all'apertura del sito
        async function caricaPodio() {
            try {
                let risposta = await fetch(API_URL);
                let podio = await risposta.json();
                
                let html = "";
                let medaglie = ["🥇", "🥈", "🥉"];
                let classi = ["oro", "argento", "bronzo"];

                for (let i = 0; i < podio.length; i++) {
                    html += `
                        <div class="podio-item ${classi[i]}">
                            <span><span class="medaglia">${medaglie[i]}</span> ${podio[i].nome}</span>
                            <span>${podio[i].punti} pt</span>
                        </div>
                    `;
                }
                
                document.getElementById("loadingPodio").style.display = "none";
                document.getElementById("contenitorePodio").innerHTML = html;
            } catch (error) {
                document.getElementById("loadingPodio").innerText = "Errore di caricamento.";
            }
        }

        // Funzione per cercare il punteggio privato tramite PIN
        async function cercaPunti() {
            let pin = document.getElementById("pinInput").value;
            if(!pin) return alert("Inserisci un PIN!");

            let bottone = document.querySelector("button");
            bottone.innerText = "Cerco...";

            try {
                let risposta = await fetch(API_URL + "?pin=" + pin);
                let dati = await risposta.json();

                if (dati.length > 0) {
                    document.getElementById("nomeRagazzo").innerText = "Ciao " + dati[0].nome;
                    document.getElementById("puntiRagazzo").innerText = dati[0].punti;
                    document.getElementById("risultatoPersonale").style.display = "block";
                } else {
                    alert("PIN non trovato! Riprova.");
                    document.getElementById("risultatoPersonale").style.display = "none";
                }
            } catch (error) {
                alert("Errore di connessione.");
            }

            bottone.innerText = "Scopri i punti!";
        }

        // Avvia il caricamento del podio appena si apre la pagina
        caricaPodio();
    </script>
</body>
</html>
